name: Build and Release EXE

on:
  push:
    branches:
      - main
    paths:
      - 'gui_cafeauto.py'
      - 'navercafe_auto.py'
      - 'sheet_manager.py'
      - 'NaverCafeAuto.spec'
      - 'CHANGELOG.md'
      - '.github/workflows/auto-build.yml'
      - '.github/scripts/release_notes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Version
        id: extract_version
        run: |
          # 파이썬 코드를 실행하여 버전 추출
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"(.*?)\"', open('gui_cafeauto.py', encoding='utf-8').read()).group(1))")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Generate release notes and version.txt
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/scripts/release_notes.py "${{ env.VERSION }}"

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v${{ env.VERSION }}; then
            echo "Release v${{ env.VERSION }} already exists. Skipping build."
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
          else
            echo "Release v${{ env.VERSION }} not found. Proceeding with build."
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
          fi
        continue-on-error: true

      - name: Build EXE with PyInstaller
        if: env.SKIP_BUILD == 'false'
        run: |
          pyinstaller --noconfirm --clean NaverCafeAuto.spec

      - name: Create Release and Upload EXE
        if: env.SKIP_BUILD == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ env.VERSION }} dist/NaverCafeAuto.exe -t "v${{ env.VERSION }}" --notes-file ".release_notes/v${{ env.VERSION }}.md"

      - name: Sync release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CHANGELOG에 있는 버전의 릴리스 설명을 모두 최신 내용으로 맞춤 (없는 릴리스는 건너뜀)
          for f in .release_notes/*.md; do
            tag=$(basename "$f" .md)
            gh release edit "$tag" --notes-file "$f" >/dev/null 2>&1 && echo "Updated notes: $tag" || true
          done

      - name: Commit version.txt
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if git diff --cached --quiet; then
            echo "version.txt unchanged"
          else
            git commit -m "Update version.txt to v${{ env.VERSION }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
